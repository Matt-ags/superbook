{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
<form action="{% url 'cadastro' %}" method="post" enctype="multipart/form-data"> {% csrf_token %}
        <input type="text" placeholder="Codinome..." name="codinome">
        <br>
        <input type="email" placeholder="Email..." name="email">
        <br>
        <input type="password" placeholder="Senha..." name="senha">
        <br>
        <input type="text" placeholder="Descricao..." name="descricao">
        <br>
        <input type="text" placeholder="Poderes..." name="poderes">
        <br>

        <input type="file" name="foto"><br>

        <input type="submit" value="Cadastrar">
    </form>
{% endblock %}
